<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#101b24">
<title>Little Dungeon — tiny runs, big adventure</title>
<style>
:root{--ink:#eef4dc;--muted:#9aab9d;--lime:#c7f36b;--orange:#ff9d62;--panel:#172730;--line:#34494c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b24;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#20343a 0,#101b24 65%)}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.shell{width:min(100vw,520px);height:min(100dvh,900px);min-height:540px;display:flex;flex-direction:column;padding:18px 18px 14px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}.brand{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.brand-mark{width:31px;height:31px;border-radius:10px;background:var(--lime);display:grid;place-items:center;color:#17251d;font-size:19px;box-shadow:0 4px 0 #8ab345}.sound{border:1px solid var(--line);background:#172730;border-radius:99px;padding:8px 11px;color:var(--muted);font-size:12px;font-weight:800}.game{position:relative;flex:1;min-height:0;border:1px solid #405455;background:#1b2829;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0005}.game canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;padding:14px;pointer-events:none}.floor-pill,.heart-pill{background:#101b24dd;border:1px solid #52625a;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:900;letter-spacing:.06em}.floor-pill span{color:var(--lime)}.heart-pill{color:#ff8d78;letter-spacing:.16em}.bossbar{position:absolute;top:57px;left:20%;right:20%;height:9px;border-radius:9px;background:#121b20;border:1px solid #87906a;overflow:hidden;display:none}.bossbar i{height:100%;width:100%;display:block;background:#f27364;transition:width .15s}.message{position:absolute;top:77px;left:50%;transform:translateX(-50%);background:#101b24cc;padding:7px 12px;border-radius:99px;color:#d4e5bd;font-size:11px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .2s}.message.show{opacity:1}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(#111e2bcc,#111e2bee);z-index:2}.overlay[hidden]{display:none}.card{width:min(100%,340px)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--lime);font-weight:900;margin-bottom:10px}.title{font-size:clamp(37px,10vw,56px);line-height:.94;letter-spacing:-.055em;margin:0 0 14px}.title em{font-style:normal;color:var(--lime)}.sub{font-size:14px;line-height:1.55;color:#bac8bb;margin:0 auto 23px;max-width:280px}.primary{background:var(--lime);color:#18241b;padding:15px 24px;border-radius:15px;font-size:16px;font-weight:1000;box-shadow:0 5px 0 #8eae50;min-width:190px;transition:transform .1s,box-shadow .1s}.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #8eae50}.hint{margin-top:15px;color:#84978d;font-size:11px}.controls{display:flex;align-items:center;justify-content:space-between;height:128px;padding:11px 8px 2px}.stick-area{height:108px;width:108px;position:relative;touch-action:none}.stick-base{position:absolute;inset:0;border-radius:50%;border:1px solid #415650;background:#233631aa;box-shadow:inset 0 0 0 8px #263c3544}.stick-base:before,.stick-base:after{content:"";position:absolute;background:#52665b44}.stick-base:before{width:1px;top:10px;bottom:10px;left:50%}.stick-base:after{height:1px;left:10px;right:10px;top:50%}.stick-knob{position:absolute;width:45px;height:45px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #9eaf86;background:#415447;box-shadow:0 4px 12px #0006;pointer-events:none}.control-label{position:absolute;bottom:-17px;left:0;right:0;color:#83968a;text-align:center;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.attack-wrap{width:116px;height:116px;position:relative;display:grid;place-items:center}.attack{width:86px;height:86px;border-radius:50%;background:var(--orange);color:#3d211b;font-size:29px;box-shadow:0 7px 0 #b85e48,0 12px 26px #0004;touch-action:none;transition:transform .08s,box-shadow .08s}.attack:active,.attack.pressed{transform:translateY(5px) scale(.97);box-shadow:0 2px 0 #b85e48}.attack-label{position:absolute;bottom:-7px;left:0;right:0;text-align:center;color:#d8a58f;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.bottom-note{text-align:center;color:#64776e;font-size:10px;margin-top:4px}.bottom-note b{color:#96ab8a;font-weight:800}@media(max-height:700px){.shell{padding:10px 14px 8px;min-height:0}.top{padding-bottom:8px}.controls{height:111px}.stick-area{width:94px;height:94px}.attack-wrap{width:104px;height:104px}.attack{width:76px;height:76px}.bottom-note{display:none}}
</style></head><body>
<main class="shell"><header class="top"><div class="brand"><span class="brand-mark">✦</span> LITTLE DUNGEON</div><button class="sound" id="soundBtn" aria-label="Toggle sound">♪ SOUND ON</button></header>
<section class="game" id="game"><canvas id="screen" aria-label="Dungeon game"></canvas><div class="hud"><div class="floor-pill">FLOOR <span id="floorNum">1</span></div><div class="heart-pill" id="hearts">♥ ♥ ♥</div></div><div class="bossbar" id="bossbar"><i id="bossFill"></i></div><div class="message" id="message"></div>
<div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">A tiny adventure</div><h1 class="title" id="title">Little<br><em>Dungeon</em></h1><p class="sub" id="subtitle">A quick little crawl. Find the exit, bonk the monsters, and see how far you get.</p><button class="primary" id="startBtn">LET’S PLAY <span>→</span></button><div class="hint" id="hint">Move with your left thumb · bonk with your right</div></div></div></section>
<div class="controls"><div class="stick-area" id="stick"><div class="stick-base"></div><div class="stick-knob" id="knob"></div><div class="control-label">MOVE</div></div><div class="attack-wrap"><button class="attack" id="attack" aria-label="Attack">✦</button><div class="attack-label">BONK!</div></div></div><div class="bottom-note">NO SETUP · NO ADS · <b>JUST ONE MORE FLOOR</b></div></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),game=document.getElementById('game');const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),floorEl=document.getElementById('floorNum'),heartsEl=document.getElementById('hearts'),messageEl=document.getElementById('message'),bossbar=document.getElementById('bossbar'),bossFill=document.getElementById('bossFill'),knob=document.getElementById('knob'),stick=document.getElementById('stick'),attackBtn=document.getElementById('attack');let W=0,H=0,scale=1,running=false,player,foes=[],floor=1,exit,rooms=[],keys={},joy={x:0,y:0},joystickId=null,last=0,attackCD=0,flash=0,toastTimer=0,soundOn=true,audio;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=game.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);scale=Math.min(W/360,H/510);if(player){player.x=clamp(player.x,20,W-20);player.y=clamp(player.y,80,H-30)}draw()}new ResizeObserver(resize).observe(game);
function beep(freq=220,dur=.07,type='sine',vol=.035){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function buildFloor(){const cols=7,rows=9,tw=(W-34)/cols,th=(H-125)/rows;rooms=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let edge=x===0||y===0||x===cols-1||y===rows-1;rooms.push({x:17+x*tw,y:86+y*th,w:tw,h:th,wall:edge||(Math.random()<.12&&!(x===3&&y===4))})}let center=rooms.find(r=>r.x< W/2&&r.x+r.w>W/2&&r.y<H/2&&r.y+r.h>H/2);if(center)center.wall=false;const open=rooms.filter(r=>!r.wall&&r.y>95);player={x:W/2,y:H*.68,r:12,hp:3,max:3,faceX:0,faceY:-1,inv:0};exit={x:W*.79,y:H*.25,r:11};foes=[];const count=floor%3===0?1:Math.min(2+Math.floor(floor/2),5);for(let i=0;i<count;i++){let x,y,tries=0;do{x=rand(40,W-40);y=rand(115,H-65);tries++}while(Math.hypot(x-player.x,y-player.y)<105&&tries<30);let boss=floor%3===0;foes.push({x,y,r:boss?20:13,hp:boss?5:1,max:boss?5:1,boss,speed:boss?30:38+Math.min(floor*2,18),hit:0,phase:Math.random()*7})}floorEl.textContent=floor;bossbar.style.display=floor%3===0?'block':'none';updateHud();}
function updateHud(){heartsEl.textContent='♥ '.repeat(player?.hp||0).trim()||'♡ ♡ ♡';if(floor%3===0&&foes[0])bossFill.style.width=(foes[0].hp/foes[0].max*100)+'%'}function toast(t){messageEl.textContent=t;messageEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>messageEl.classList.remove('show'),1050)}function start(){floor=1;running=true;overlay.hidden=true;buildFloor();last=performance.now();requestAnimationFrame(loop);beep(440,.1)}function nextFloor(){floor++;buildFloor();toast(floor%3===0?'BOSS FLOOR!':'FLOOR '+floor);beep(500,.12,'triangle')}
function endGame(){running=false;overlay.hidden=false;document.getElementById('eyebrow').textContent='RUN OVER · FLOOR '+floor;document.getElementById('title').innerHTML='Good<br><em>bonking!</em>';document.getElementById('subtitle').textContent='You made it to floor '+floor+'. The dungeon will be right here when you’re ready.';startBtn.innerHTML='TRY AGAIN <span>↻</span>';document.getElementById('hint').textContent='One tap and you’re back in';beep(110,.35,'sawtooth',.04)}
function attack(){if(!running||attackCD>0)return;attackCD=.38;player.swing=.23;let hit=false;for(let f of foes){let dx=f.x-player.x,dy=f.y-player.y,d=Math.hypot(dx,dy),dot=(dx*player.faceX+dy*player.faceY)/(d||1);if(d<53&&dot>-.22){f.hp--;f.hit=.18;hit=true;if(f.hp<=0){foes=foes.filter(x=>x!==f);beep(f.boss?130:320,.12,f.boss?'sawtooth':'triangle',.045);if(f.boss)toast('BOSS DOWN!')}else beep(190,.07,'square',.025)}}if(!hit)beep(260,.04,'sine',.015);updateHud();if(!foes.length){toast('EXIT OPEN!');exit.open=true}}
function hurt(f){if(player.inv>0)return;player.hp--;player.inv=.85;updateHud();beep(95,.18,'sawtooth',.05);if(player.hp<=0)endGame()}
function movePlayer(dt){let x=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(l>.1){player.faceX=x;player.faceY=y}let speed=145*dt;x=clamp(player.x+x*speed,26,W-26);y=clamp(player.y+y*speed,93,H-27);player.x=x;player.y=y}
function update(dt){attackCD=Math.max(0,attackCD-dt);player.inv=Math.max(0,player.inv-dt);player.swing=Math.max(0,(player.swing||0)-dt);for(const f of foes){f.hit=Math.max(0,f.hit-dt);f.phase+=dt;let dx=player.x-f.x,dy=player.y-f.y,d=Math.hypot(dx,dy)||1;if(d>player.r+f.r+4){f.x+=dx/d*f.speed*dt;f.y+=dy/d*f.speed*dt}else hurt(f)}if(exit.open&&Math.hypot(player.x-exit.x,player.y-exit.y)<24)nextFloor()}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#202b28';ctx.fillRect(0,0,W,H);let cols=7,rows=9,tw=(W-34)/cols,th=(H-125)/rows;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=17+x*tw,py=86+y*th,edge=x===0||y===0||x===cols-1||y===rows-1,wall=edge||(Math.sin(x*16+y*27+floor*3)*.5+.5<.12&&!(x===3&&y===4));ctx.fillStyle=wall?'#34413a':'#293630';ctx.fillRect(px+1,py+1,tw-2,th-2);if(!wall){ctx.fillStyle='#344239';ctx.fillRect(px+tw*.5,py+th*.5,2,2);ctx.fillStyle='#25332e';ctx.fillRect(px+tw*.22,py+th*.28,2,2)}}
// border and exit
ctx.strokeStyle='#56624f';ctx.lineWidth=3;ctx.strokeRect(18,87,W-36,H-124);if(exit){ctx.save();ctx.translate(exit.x,exit.y);ctx.globalAlpha=exit.open?1:.38;ctx.fillStyle=exit.open?'#c7f36b':'#7d9c66';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=exit.open?18:0;ctx.beginPath();ctx.arc(0,0,exit.r+4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#25332b';ctx.beginPath();ctx.arc(0,0,exit.r-2,0,Math.PI*2);ctx.fill();ctx.fillStyle=exit.open?'#e9ffb0':'#8ea77d';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(exit.open?'↑':'?',0,4);ctx.restore()}
for(const f of foes){ctx.save();ctx.translate(f.x,f.y+Math.sin(f.phase*4)*2);ctx.fillStyle=f.hit?'#fff1c9':f.boss?'#c75e58':'#e27c62';ctx.shadowColor=f.boss?'#f27364':'#e27c62';ctx.shadowBlur=f.boss?12:0;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#462f2b';ctx.beginPath();ctx.arc(-f.r*.32,-2,2.2,0,Math.PI*2);ctx.arc(f.r*.32,-2,2.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe1a5';ctx.fillRect(-f.r*.45,-f.r*.58,4,3);ctx.fillRect(f.r*.2,-f.r*.58,4,3);ctx.restore()}
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.globalAlpha=player.inv>0&&Math.floor(player.inv*14)%2?.35:1;ctx.fillStyle='#17231e';ctx.beginPath();ctx.ellipse(0,9,12,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#91c9a0';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8e8b5';ctx.beginPath();ctx.arc(0,-2,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#30453a';ctx.beginPath();ctx.arc(-3,-3,1.5,0,Math.PI*2);ctx.arc(3,-3,1.5,0,Math.PI*2);ctx.fill();if(player.swing>0){ctx.strokeStyle='#ffbd79';ctx.lineWidth=5;ctx.beginPath();let a=Math.atan2(player.faceY,player.faceX);ctx.arc(0,0,24,a-.9,a+.9);ctx.stroke()}else{ctx.strokeStyle='#c7f36b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.faceX*8,player.faceY*8);ctx.lineTo(player.faceX*16,player.faceY*16);ctx.stroke()}ctx.restore()}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;movePlayer(dt);update(dt);draw();if(running)requestAnimationFrame(loop)}
startBtn.addEventListener('click',start);attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();attackBtn.setPointerCapture(e.pointerId);attackBtn.classList.add('pressed');attack()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>attackBtn.addEventListener(ev,()=>attackBtn.classList.remove('pressed')));stick.addEventListener('pointerdown',e=>{e.preventDefault();joystickId=e.pointerId;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joystickId)joyMove(e)});function joyMove(e){const b=stick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),lim=b.width*.34,len=Math.hypot(dx,dy)||1,m=Math.min(len,lim);joy.x=dx/len*(m/lim);joy.y=dy/len*(m/lim);knob.style.transform=`translate(calc(-50% + ${joy.x*lim}px),calc(-50% + ${joy.y*lim}px))`}function releaseJoy(){joystickId=null;joy.x=joy.y=0;knob.style.transform='translate(-50%,-50%)'}stick.addEventListener('pointerup',releaseJoy);stick.addEventListener('pointercancel',releaseJoy);window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();attack()}});window.addEventListener('keyup',e=>keys[e.key]=false);document.getElementById('soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';if(soundOn)beep(440,.07)});resize();})();
</script></body></html>
